name: daily check-in

on:
  schedule:
    # 16:05 UTC, which is 00:05 in UTC+8. This fires ten minutes ahead of the
    # randomised window below on purpose: the Actions scheduler is routinely a
    # few minutes to half an hour late, and starting early means the whole
    # window is still reachable when it is, rather than only the tail of it.
    - cron: '5 16 * * *'
  workflow_dispatch:
    inputs:
      mood:
        description: 'Force a mood code (blank picks one at random)'
        required: false
        default: ''
      jitter:
        description: 'Wait for a random slot in the window instead of running now'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Log in and report status without checking in'
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-check-in
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The check-in should land at an unremarkable, different time every day rather
  # than on the same minute forever. Expressed in UTC; add 8 hours for UTC+8.
  WINDOW_START_UTC: '16:15'   # 00:15 in UTC+8
  WINDOW_END_UTC: '17:00'     # 01:00 in UTC+8

jobs:
  check-in:
    runs-on: ubuntu-22.04
    # Generous enough to cover the ten minute lead, the full window, and setup.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # Placed after setup so that the request goes out at the chosen instant
      # rather than a minute or two after it.
      - name: Wait for a randomised slot
        if: github.event_name == 'schedule' || inputs.jitter
        run: .github/scripts/wait-for-slot.sh

      - name: Check in
        env:
          DZ_BASE_URL: ${{ secrets.DZ_BASE_URL }}
          DZ_USER: ${{ secrets.DZ_USER }}
          DZ_PASS: ${{ secrets.DZ_PASS }}
          DZ_QUESTION: ${{ secrets.DZ_QUESTION }}
          DZ_ANSWER: ${{ secrets.DZ_ANSWER }}
          DZ_MOOD: ${{ inputs.mood }}
          DZ_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python sign.py
